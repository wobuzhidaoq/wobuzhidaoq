name: 💾 Сохранить стиль

# Запуск: вкладка Actions → «💾 Сохранить стиль» → Run workflow.
# Создаёт тег style-<название> — неизменяемую закладку на текущий вид профиля.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Название стиля латиницей, например sakura-day (тег будет style-sakura-day)"
        required: true
      ref:
        description: "Что сохранить: ветка, тег или коммит (по умолчанию — main)"
        required: false
        default: main
      description:
        description: "Короткое описание стиля (по желанию)"
        required: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🏷️ Создать тег
        env:
          NAME: ${{ inputs.name }}
          REF: ${{ inputs.ref }}
          DESC: ${{ inputs.description }}
        run: |
          tag="style-${NAME#style-}"
          if ! git check-ref-format "refs/tags/$tag"; then
            echo "::error::Недопустимое название: $NAME"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::Стиль $tag уже сохранён — выбери другое название"; exit 1
          fi
          sha=$(git rev-parse -q --verify "origin/$REF^{commit}" || git rev-parse -q --verify "$REF^{commit}") || {
            echo "::error::Не нашёл ветку, тег или коммит: $REF"; exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$sha" -m "${DESC:-Сохранённый стиль $tag}"
          git push origin "refs/tags/$tag"
          {
            echo "### 💾 Стиль сохранён как \`$tag\`"
            echo "Посмотреть: https://github.com/${GITHUB_REPOSITORY}/tree/$tag"
          } >> "$GITHUB_STEP_SUMMARY"
