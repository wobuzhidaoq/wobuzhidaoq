name: 🌸 Обновить аниме-профиль

on:
  schedule:
    - cron: "17 */6 * * *" # каждые 6 часов
  workflow_dispatch: # кнопка «Run workflow» во вкладке Actions
  push:
    branches: [main]
    paths-ignore:
      - "assets/generated/**"

permissions:
  contents: write

concurrency:
  group: anime-profile-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ✨ Шапка, окно статуса, цитата дня, список аниме, виджеты README
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet pillow
          python3 scripts/build.py

      - name: 💾 Сохранить изменения
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated README.md
          if git diff --cached --quiet; then
            echo "Ничего не изменилось 💤"
            exit 0
          fi
          git commit -m "🌸 Обновление аниме-профиля"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
